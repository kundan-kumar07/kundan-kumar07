name: Update LeetCode Stats

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leetcode-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate LeetCode stats SVG
        env:
          LEETCODE_USERNAME: kundan_kumar07
          OUT_PATH: assets/leetcode-stats.svg
        run: node scripts/generate-leetcode-svg.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-stats.svg
          git diff --staged --quiet || git commit -m "chore: update LeetCode stats [skip ci]"
          git push
